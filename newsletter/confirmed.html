<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You’re on the list | Quietly Smart</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: #46438a;
      color: #f4e3c9;
      font-family: Montserrat, Arial, sans-serif;
    }
    main {
      width: min(620px, 100%);
      padding: 44px 38px;
      border-radius: 24px;
      background: #f4e3c9;
      color: #2e2b52;
      box-shadow: 0 18px 55px rgba(25, 21, 70, 0.25);
    }
    img { width: 220px; max-width: 70%; height: auto; margin-bottom: 32px; }
    h1 { margin: 0 0 18px; color: #46438a; font-size: clamp(32px, 7vw, 48px); line-height: 1.05; }
    p { margin: 0 0 16px; font-size: 18px; line-height: 1.6; }
    p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <img src="../email/logo-qs-white.png" alt="Quietly Smart" style="background:#46438a;padding:16px 20px;border-radius:16px">
    <h1>You’re on the list.</h1>
    <p>Thanks. I’ll send you one useful, grounded email about AI every two weeks.</p>
    <p>If I have nothing worth saying, I’d rather skip an issue than waste your time.</p>
    <p>Matt</p>
  </main>
</body>
</html>
